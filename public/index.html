<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquipedia Round Robin Seeding Stage</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      /* Liquipedia Dark Palette */
      --lp-bg: #14181d;
      --lp-card-bg: #1c2228;
      --lp-header-bg: #262e37;
      --lp-border: #313c49;
      --lp-border-hover: #58a6ff;
      --lp-primary-blue: #58a6ff;
      --lp-text-main: #e6edf3;
      --lp-text-muted: #8b949e;
      --lp-row-alt: #171c22;
      --lp-input-bg: #0d1117;
      --lp-danger: #f85149;
      --lp-green: #3fb950;
      --lp-gold: #f0883e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--lp-bg);
      color: var(--lp-text-main);
      padding: 1.5rem 1rem 3rem 1rem;
      line-height: 1.4;
      font-size: 13px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--lp-primary-blue);
      border-bottom: 2px solid var(--lp-primary-blue);
      padding-bottom: 6px;
      margin-top: 28px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .section-title:first-child { margin-top: 0; }
    .section-title span.sub { font-size: 12px; color: var(--lp-text-muted); font-weight: normal; }

    /* ================= 5-TEAM CARDS ================= */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .team-card {
      position: relative;
      height: 250px;
      background: var(--lp-card-bg);
      border: 1px solid var(--lp-border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .team-card:hover {
      border-color: var(--lp-border-hover);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .card-front {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .team-tag {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--lp-primary-blue);
      line-height: 1;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .team-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--lp-text-main);
    }

    .hover-hint {
      position: absolute;
      bottom: 8px;
      font-size: 10px;
      color: var(--lp-text-muted);
      letter-spacing: 0.5px;
      opacity: 0.6;
    }

    .card-roster {
      position: absolute;
      inset: 0;
      background: var(--lp-card-bg);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .team-card:hover .card-front { opacity: 0; transform: scale(1.02); }
    .team-card:hover .card-roster { opacity: 1; transform: scale(1); pointer-events: auto; }

    .roster-header {
      background: var(--lp-header-bg);
      padding: 6px 12px;
      font-weight: 700;
      font-size: 11px;
      color: var(--lp-primary-blue);
      border-bottom: 1px solid var(--lp-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
    }

    .roster-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      list-style: none;
      padding: 0;
    }

    .roster-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .roster-item:nth-child(even) { background: var(--lp-row-alt); }

    .player-role-icon { width: 22px; height: 22px; display: flex; align-items: center; }
    .role-logo { width: 18px; height: 18px; object-fit: contain; }
    .player-ign { font-size: 12px; font-weight: 700; color: var(--lp-text-main); }

    /* ================= SPLIT STAGE SECTION ================= */
    .stage-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .stage-layout { grid-template-columns: 1fr; }
    }

    /* STANDINGS TABLE */
    .standings-card {
      background: var(--lp-card-bg);
      border: 1px solid var(--lp-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .standings-table th {
      background: var(--lp-header-bg);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--lp-text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--lp-border);
    }

    .standings-table td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }

    .standings-table tr:nth-child(even) { background: var(--lp-row-alt); }

    .seed-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .seed-1 { background: rgba(240, 136, 62, 0.2); color: #f0883e; border: 1px solid #f0883e; }
    .seed-2 { background: rgba(88, 166, 255, 0.2); color: #58a6ff; border: 1px solid #58a6ff; }
    .seed-3 { background: rgba(63, 185, 80, 0.2); color: #3fb950; border: 1px solid #3fb950; }
    .seed-4 { background: rgba(139, 148, 158, 0.15); color: #c9d1d9; border: 1px solid var(--lp-border); }
    .seed-5 { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }

    /* MATCHES GRID */
    .rounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .round-card {
      background: var(--lp-card-bg);
      border: 1px solid var(--lp-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .round-header {
      background: var(--lp-header-bg);
      padding: 6px 10px;
      font-weight: 700;
      font-size: 11px;
      color: var(--lp-primary-blue);
      border-bottom: 1px solid var(--lp-border);
      display: flex;
      justify-content: space-between;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .match-row:nth-child(even) { background: var(--lp-row-alt); }

    .match-team {
      flex: 1;
      font-weight: 700;
      font-size: 13px;
    }

    .match-team.team-a { text-align: left; }
    .match-team.team-b { text-align: right; }

    .match-team.winner { color: var(--lp-green); }
    .match-team.loser { color: var(--lp-text-muted); opacity: 0.6; }

    .match-score-pill {
      background: var(--lp-header-bg);
      border: 1px solid var(--lp-border);
      border-radius: 3px;
      padding: 2px 8px;
      font-weight: 800;
      font-size: 12px;
      min-width: 42px;
      text-align: center;
      margin: 0 8px;
    }

    .status-badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: bold;
    }
    .status-LIVE { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }

    /* ================= ADMIN MODAL ================= */
    .admin-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .admin-modal {
      background: var(--lp-card-bg);
      border: 1px solid var(--lp-border);
      border-radius: 8px;
      width: 90%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--lp-border);
      padding-bottom: 8px;
    }

    .admin-header h2 { font-size: 1.1rem; color: var(--lp-primary-blue); }
    .admin-close { background: none; border: none; color: var(--lp-text-muted); font-size: 18px; cursor: pointer; }

    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--lp-border);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--lp-text-muted);
      font-weight: bold;
      cursor: pointer;
      padding: 4px 8px;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active { color: var(--lp-primary-blue); border-color: var(--lp-primary-blue); }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; color: var(--lp-text-muted); margin-bottom: 4px; text-transform: uppercase; }

    .form-control {
      width: 100%;
      background: var(--lp-input-bg);
      border: 1px solid var(--lp-border);
      border-radius: 4px;
      color: var(--lp-text-main);
      padding: 6px 10px;
      font-size: 13px;
    }

    .player-row-input {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .btn { padding: 6px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
    .btn-primary { background: var(--lp-primary-blue); color: #fff; }
    .btn-danger { background: var(--lp-danger); color: #fff; }
    .btn-secondary { background: var(--lp-header-bg); color: var(--lp-text-main); border-color: var(--lp-border); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. 5 TEAMS ROW -->
    <div class="section-title" id="pageTitle" title="Double click or press Ctrl+Shift+A for Admin Panel">
      <span>Participating Teams</span>
      <span class="sub">Hover over a team to view active roster</span>
    </div>
    <div class="teams-grid" id="teamsContainer"></div>

    <!-- 2. SEEDING STAGE (STANDINGS + BO1 MATCHES) -->
    <div class="section-title">
      <span>Round Robin Seeding Stage (Best of 1)</span>
      <span class="sub">Top 1 to Top 5 Seeding Determination</span>
    </div>

    <div class="stage-layout">
      
      <!-- LEFT: LIVE SEEDING STANDINGS TABLE -->
      <div class="standings-card">
        <table class="standings-table">
          <thead>
            <tr>
              <th style="width: 70px;">Seed</th>
              <th>Team</th>
              <th style="text-align: center; width: 60px;">W - L</th>
              <th style="text-align: right; width: 60px;">Win %</th>
            </tr>
          </thead>
          <tbody id="standingsTableBody">
            <!-- Rendered live via JS -->
          </tbody>
        </table>
      </div>

      <!-- RIGHT: 5 ROUNDS BO1 MATCHES -->
      <div class="rounds-grid" id="roundsContainer"></div>

    </div>

  </div>

  <!-- Admin Modal -->
  <div class="admin-modal-overlay" id="adminModal">
    <div class="admin-modal">
      <div class="admin-header">
        <h2>Tournament Manager (Bo1 Round Robin)</h2>
        <button class="admin-close" id="adminCloseBtn">&times;</button>
      </div>

      <div class="form-group">
        <label>Admin Secret Key</label>
        <input type="password" class="form-control" id="adminKeyInput">
      </div>

      <div class="admin-tabs">
        <button class="tab-btn active" id="tabTeamsBtn">Manage 5 Teams</button>
        <button class="tab-btn" id="tabMatchesBtn">Manage Bo1 Matches & Scores</button>
      </div>

      <!-- TAB 1: TEAMS -->
      <div id="tabTeamsSection">
        <div class="form-group">
          <label>Select Team to Edit or Add</label>
          <select class="form-control" id="adminSelectTeam"></select>
        </div>
        <div class="form-group">
          <label>Team Tag</label>
          <input type="text" class="form-control" id="editTag" placeholder="e.g. TL">
        </div>
        <div class="form-group">
          <label>Team Full Name</label>
          <input type="text" class="form-control" id="editName" placeholder="e.g. Team Liquid">
        </div>
        <div class="form-group">
          <label>Players</label>
          <div class="player-row-input"><span>EXP:</span><input type="text" class="form-control" id="expLane"></div>
          <div class="player-row-input"><span>Core:</span><input type="text" class="form-control" id="core"></div>
          <div class="player-row-input"><span>Mid:</span><input type="text" class="form-control" id="midLane"></div>
          <div class="player-row-input"><span>Gold:</span><input type="text" class="form-control" id="goldLane"></div>
          <div class="player-row-input"><span>Roam:</span><input type="text" class="form-control" id="roam"></div>
          <div class="player-row-input"><span>6th Man:</span><input type="text" class="form-control" id="sixthMan"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:14px;">
          <button class="btn btn-danger" id="adminDeleteBtn" style="display:none;">Delete Team</button>
          <button class="btn btn-primary" id="adminSaveBtn" style="margin-left:auto;">Save Team</button>
        </div>
      </div>

      <!-- TAB 2: BO1 MATCHES -->
      <div id="tabMatchesSection" style="display:none;">
        <div style="margin-bottom:14px;">
          <button class="btn btn-primary" id="btnGenSchedule">Generate / Reset 5-Team Bo1 Schedule</button>
        </div>
        <div class="form-group">
          <label>Select Match</label>
          <select class="form-control" id="adminSelectMatch"></select>
        </div>

        <div class="form-group">
          <label>Quick Bo1 Outcome</label>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" id="btnWinA" style="flex:1;">Team A Wins (1 - 0)</button>
            <button class="btn btn-secondary" id="btnWinB" style="flex:1;">Team B Wins (0 - 1)</button>
            <button class="btn btn-secondary" id="btnResetMatch">Reset (0 - 0)</button>
          </div>
        </div>

        <div class="form-group" style="margin-top:10px;">
          <label>Status</label>
          <select class="form-control" id="matchStatus">
            <option value="UPCOMING">UPCOMING</option>
            <option value="LIVE">LIVE</option>
            <option value="COMPLETED">COMPLETED</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let teamsData = [];
    let matchesData = [];

    const roleDefinitions = [
      { key: "expLane", name: "EXP Lane", logo: "assets/exp.png" },
      { key: "core", name: "Core", logo: "assets/core.png" },
      { key: "midLane", name: "Mid Lane", logo: "assets/mid.png" },
      { key: "goldLane", name: "Gold Lane", logo: "assets/gold.png" },
      { key: "roam", name: "Roam", logo: "assets/roam.png" },
      { key: "sixthMan", name: "6th Man", logo: "assets/sub.svg" }
    ];

    async function loadAllData() {
      try {
        const [teamsRes, matchesRes] = await Promise.all([
          fetch('/api/teams'),
          fetch('/api/matches')
        ]);
        teamsData = await teamsRes.json();
        matchesData = await matchesRes.json();
        render5Teams();
        renderStandings();
        renderRoundRobin();
      } catch (err) {
        console.error("Error loading tournament data:", err);
      }
    }

    // 1. Render 5 Team Cards
    function render5Teams() {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      for (let i = 0; i < 5; i++) {
        const team = teamsData[i];
        const card = document.createElement('div');
        card.className = 'team-card';

        if (team) {
          let rosterRows = '';
          roleDefinitions.forEach(role => {
            const ign = (team.players && team.players[role.key]) || "TBD";
            rosterRows += `
              <li class="roster-item">
                <div class="player-role-icon"><img class="role-logo" src="${role.logo}" alt="${role.name}"></div>
                <span class="player-ign">${ign}</span>
              </li>
            `;
          });

          card.innerHTML = `
            <div class="card-front">
              <div class="team-tag">${team.tag}</div>
              <div class="team-name">${team.name}</div>
              <div class="hover-hint">HOVER FOR ROSTER</div>
            </div>
            <div class="card-roster">
              <div class="roster-header"><span>${team.name}</span><span>ROSTER</span></div>
              <ul class="roster-list">${rosterRows}</ul>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="card-front">
              <div class="team-tag" style="opacity: 0.25;">TBD</div>
              <div class="team-name" style="color: var(--lp-text-muted);">Empty Slot ${i + 1}</div>
              <div class="hover-hint">AWAITING REGISTRATION</div>
            </div>
          `;
        }
        container.appendChild(card);
      }
    }

    // 2. Render Live Seeding Standings (Top 1 to Top 5)
    function renderStandings() {
      const tbody = document.getElementById('standingsTableBody');
      tbody.innerHTML = '';

      // Initialize team stats
      const statsMap = {};
      teamsData.forEach(t => {
        statsMap[t._id] = { team: t, wins: 0, losses: 0, played: 0 };
      });

      // Calculate from completed Bo1 matches
      matchesData.forEach(m => {
        if (m.status === 'COMPLETED' && m.teamA && m.teamB) {
          const idA = m.teamA._id || m.teamA;
          const idB = m.teamB._id || m.teamB;

          if (statsMap[idA] && statsMap[idB]) {
            statsMap[idA].played++;
            statsMap[idB].played++;
            if (m.scoreA > m.scoreB) {
              statsMap[idA].wins++;
              statsMap[idB].losses++;
            } else if (m.scoreB > m.scoreA) {
              statsMap[idB].wins++;
              statsMap[idA].losses++;
            }
          }
        }
      });

      // Sort by Wins desc, then Losses asc
      const sortedStandings = Object.values(statsMap).sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        return a.losses - b.losses;
      });

      for (let i = 0; i < 5; i++) {
        const item = sortedStandings[i];
        const seedNumber = i + 1;
        const winRate = item && item.played > 0 ? Math.round((item.wins / item.played) * 100) : 0;

        tbody.innerHTML += `
          <tr>
            <td><span class="seed-badge seed-${seedNumber}">#${seedNumber} Seed</span></td>
            <td style="font-weight: 700;">
              ${item ? `<span style="color:var(--lp-primary-blue);">${item.team.tag}</span> <span style="font-size:11px; color:var(--lp-text-muted); font-weight:normal;">(${item.team.name})</span>` : '<span style="color:var(--lp-text-muted);">TBD</span>'}
            </td>
            <td style="text-align: center; font-weight: 800;">
              ${item ? `<span style="color:var(--lp-green);">${item.wins}</span> - <span style="color:var(--lp-danger);">${item.losses}</span>` : '0 - 0'}
            </td>
            <td style="text-align: right; color:var(--lp-text-muted); font-weight: 600;">
              ${winRate}%
            </td>
          </tr>
        `;
      }
    }

    // 3. Render 5 Rounds of Bo1 Matches
    function renderRoundRobin() {
      const container = document.getElementById('roundsContainer');
      container.innerHTML = '';

      if (!matchesData || matchesData.length === 0) {
        container.innerHTML = '<div style="color:var(--lp-text-muted); padding:10px;">Schedule not yet generated. Open Admin Panel (Ctrl+Shift+A) to generate.</div>';
        return;
      }

      for (let r = 1; r <= 5; r++) {
        const roundMatches = matchesData.filter(m => m.round === r);
        const roundCard = document.createElement('div');
        roundCard.className = 'round-card';

        let matchesHTML = '';
        roundMatches.forEach(m => {
          const tagA = m.teamA ? m.teamA.tag : "TBD";
          const tagB = m.teamB ? m.teamB.tag : "TBD";

          const isTeamAWinner = m.status === 'COMPLETED' && m.scoreA > m.scoreB;
          const isTeamBWinner = m.status === 'COMPLETED' && m.scoreB > m.scoreA;

          matchesHTML += `
            <div class="match-row">
              <span class="match-team team-a ${isTeamAWinner ? 'winner' : (m.status === 'COMPLETED' ? 'loser' : '')}">${tagA}</span>
              <span class="match-score-pill">${m.scoreA} : ${m.scoreB}</span>
              <span class="match-team team-b ${isTeamBWinner ? 'winner' : (m.status === 'COMPLETED' ? 'loser' : '')}">${tagB}</span>
            </div>
          `;
        });

        roundCard.innerHTML = `
          <div class="round-header">
            <span>ROUND ${r}</span>
            <span style="font-size:10px; color:var(--lp-text-muted);">BO1</span>
          </div>
          ${matchesHTML}
        `;
        container.appendChild(roundCard);
      }
    }

    socket.on('teamsUpdated', () => loadAllData());
    socket.on('matchesUpdated', () => loadAllData());
    loadAllData();

    // ================= ADMIN LOGIC =================
    const modal = document.getElementById('adminModal');
    const adminKeyInput = document.getElementById('adminKeyInput');
    const tabTeamsBtn = document.getElementById('tabTeamsBtn');
    const tabMatchesBtn = document.getElementById('tabMatchesBtn');
    const tabTeamsSection = document.getElementById('tabTeamsSection');
    const tabMatchesSection = document.getElementById('tabMatchesSection');

    adminKeyInput.value = localStorage.getItem('admin_key') || "IHS_ADMIN_2025";

    tabTeamsBtn.addEventListener('click', () => {
      tabTeamsBtn.classList.add('active');
      tabMatchesBtn.classList.remove('active');
      tabTeamsSection.style.display = 'block';
      tabMatchesSection.style.display = 'none';
    });

    tabMatchesBtn.addEventListener('click', () => {
      tabMatchesBtn.classList.add('active');
      tabTeamsBtn.classList.remove('active');
      tabTeamsSection.style.display = 'none';
      tabMatchesSection.style.display = 'block';
      populateMatchesDropdown();
    });

    function toggleAdmin() {
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      if (modal.style.display === 'flex') populateTeamsDropdown();
    }

    // --- TEAMS TAB ---
    const selectTeam = document.getElementById('adminSelectTeam');
    const editTag = document.getElementById('editTag');
    const editName = document.getElementById('editName');
    const deleteBtn = document.getElementById('adminDeleteBtn');

    function populateTeamsDropdown() {
      selectTeam.innerHTML = '';
      teamsData.forEach((team) => {
        const opt = document.createElement('option');
        opt.value = team._id;
        opt.innerText = `Edit: [${team.tag}] ${team.name}`;
        selectTeam.appendChild(opt);
      });

      if (teamsData.length < 5) {
        const addOpt = document.createElement('option');
        addOpt.value = "NEW";
        addOpt.innerText = `+ Add New Team (${teamsData.length}/5)`;
        selectTeam.appendChild(addOpt);
      }

      loadSelectedTeamToForm();
    }

    function loadSelectedTeamToForm() {
      const selectedId = selectTeam.value;
      if (selectedId === "NEW" || !selectedId) {
        editTag.value = '';
        editName.value = '';
        roleDefinitions.forEach(r => document.getElementById(r.key).value = '');
        deleteBtn.style.display = 'none';
      } else {
        const team = teamsData.find(t => t._id === selectedId);
        if (team) {
          editTag.value = team.tag;
          editName.value = team.name;
          roleDefinitions.forEach(r => {
            document.getElementById(r.key).value = team.players[r.key] || '';
          });
          deleteBtn.style.display = 'inline-block';
        }
      }
    }

    selectTeam.addEventListener('change', loadSelectedTeamToForm);

    document.getElementById('adminSaveBtn').addEventListener('click', async () => {
      const adminKey = adminKeyInput.value.trim();
      localStorage.setItem('admin_key', adminKey);

      const payload = {
        name: editName.value.trim(),
        tag: editTag.value.trim().toUpperCase(),
        players: {
          expLane: document.getElementById('expLane').value.trim(),
          core: document.getElementById('core').value.trim(),
          midLane: document.getElementById('midLane').value.trim(),
          goldLane: document.getElementById('goldLane').value.trim(),
          roam: document.getElementById('roam').value.trim(),
          sixthMan: document.getElementById('sixthMan').value.trim()
        }
      };

      const selectedId = selectTeam.value;
      const isNew = selectedId === "NEW";
      const url = isNew ? '/api/teams' : `/api/teams/${selectedId}`;
      const method = isNew ? 'POST' : 'PUT';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadAllData();
        toggleAdmin();
      } catch (err) { alert(err.message); }
    });

    deleteBtn.addEventListener('click', async () => {
      const selectedId = selectTeam.value;
      if (!selectedId || selectedId === "NEW") return;
      if (!confirm("Delete team?")) return;

      try {
        const res = await fetch(`/api/teams/${selectedId}`, {
          method: 'DELETE',
          headers: { 'x-admin-key': adminKeyInput.value.trim() }
        });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadAllData();
        toggleAdmin();
      } catch (err) { alert(err.message); }
    });

    // --- MATCHES TAB (BO1 FAST UPDATE) ---
    const selectMatch = document.getElementById('adminSelectMatch');
    const matchStatus = document.getElementById('matchStatus');

    function populateMatchesDropdown() {
      selectMatch.innerHTML = '';
      matchesData.forEach((m) => {
        const tagA = m.teamA ? m.teamA.tag : "TBD";
        const tagB = m.teamB ? m.teamB.tag : "TBD";
        const opt = document.createElement('option');
        opt.value = m._id;
        opt.innerText = `[${m.matchCode}] ${tagA} vs ${tagB} (Score: ${m.scoreA}-${m.scoreB})`;
        selectMatch.appendChild(opt);
      });
      loadSelectedMatch();
    }

    function loadSelectedMatch() {
      const m = matchesData.find(match => match._id === selectMatch.value);
      if (m) {
        document.getElementById('btnWinA').innerText = `${m.teamA ? m.teamA.tag : 'A'} Wins (1 - 0)`;
        document.getElementById('btnWinB').innerText = `${m.teamB ? m.teamB.tag : 'B'} Wins (0 - 1)`;
        matchStatus.value = m.status;
      }
    }

    selectMatch.addEventListener('change', loadSelectedMatch);

    async function sendMatchUpdate(scoreA, scoreB, status) {
      const matchId = selectMatch.value;
      if (!matchId) return;

      try {
        const res = await fetch(`/api/matches/${matchId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKeyInput.value.trim() },
          body: JSON.stringify({ scoreA, scoreB, status })
        });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadAllData();
        populateMatchesDropdown();
      } catch (err) { alert(err.message); }
    }

    document.getElementById('btnWinA').addEventListener('click', () => sendMatchUpdate(1, 0, 'COMPLETED'));
    document.getElementById('btnWinB').addEventListener('click', () => sendMatchUpdate(0, 1, 'COMPLETED'));
    document.getElementById('btnResetMatch').addEventListener('click', () => sendMatchUpdate(0, 0, 'UPCOMING'));

    document.getElementById('btnGenSchedule').addEventListener('click', async () => {
      if (!confirm("Generate 5-Team Bo1 Schedule? This resets match scores.")) return;
      try {
        const res = await fetch('/api/matches/generate-schedule', {
          method: 'POST',
          headers: { 'x-admin-key': adminKeyInput.value.trim() }
        });
        if (!res.ok) throw new Error((await res.json()).error);
        await loadAllData();
        populateMatchesDropdown();
      } catch (err) { alert(err.message); }
    });

    document.getElementById('adminCloseBtn').addEventListener('click', toggleAdmin);
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        toggleAdmin();
      }
    });
    document.getElementById('pageTitle').addEventListener('dblclick', toggleAdmin);
  </script>
</body>
</html>
